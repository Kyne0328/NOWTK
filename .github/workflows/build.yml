name: Build and release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true
          ref: ${{ env.TAG }}
      - name: Setup .NET Core SDK 6.0.400
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.0.400
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: >
          dotnet publish .\NOWT\NOWT.csproj
          --configuration Release
          -p:PublishSingleFile=true
          --self-contained false -r win-x64
          -o ./inno
      - name: Download netcorecheck
        shell: pwsh
        run: |
          Invoke-WebRequest -URI https://go.microsoft.com/fwlink/?linkid=2135256 -OutFile .\inno\netcorecheck.exe
          Invoke-WebRequest -URI https://go.microsoft.com/fwlink/?linkid=2135504 -OutFile .\inno\netcorecheck_x64.exe
      - name: Install InnoSetup
        run: choco install innosetup
      - name: Package application
        run: ISCC.exe ./NOWT.iss
      - name: Rename installer
        shell: pwsh
        run: |
          Rename-Item ./inno/out/NOWT.exe NOWT-Installer.exe
      - name: Get CHANGELOG
        id: changelog
        continue-on-error: true
        uses: requarks/changelog-action@v1.8.1
        with:
          token: ${{ github.token }}
          tag: ${{ env.TAG }}
          writeToFile: false
          excludeTypes: chore,ci,build,docs,style
          # Include non-conventional commits so the step doesn't fail when commit
          # messages don't follow the conventional commit format (e.g. "Fix ..." vs "fix: ...")
          includeInvalidCommits: true
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./inno/out/NOWT-Installer.exe
            ./inno/NOWT.exe
          tag_name: ${{ env.TAG }}
          body: |
            ![Release downloads](https://img.shields.io/github/downloads/Kyne0328/NOWTK/${{ env.TAG }}/total)
            ${{ steps.changelog.outputs.changes }}
